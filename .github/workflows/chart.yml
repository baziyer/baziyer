name: chart
on:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:
  push: {branches: [main], paths: [chart.py]}
permissions: {contents: write}
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 chart.py
        env: {GH_TOKEN: "${{ github.token }}"}
      - run: |
          git config user.name github-actions && git config user.email github-actions@github.com
          git add chart-*.svg && git diff --cached --quiet || git commit -m "chart: refresh" && git push
